[project]
name = "beams"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.37.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "diagrams>=0.23.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
